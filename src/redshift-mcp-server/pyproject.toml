[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "redshift-mcp-server"
version = "0.1.0"
description = "A small, TLS-only Amazon Redshift metadata MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.26,<2",
    "python-dotenv>=1.2,<2",
    "azure-identity>=1.25,<2",
    "boto3>=1.43.55,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[project.scripts]
redshift-mcp-server = "redshift_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["redshift_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
